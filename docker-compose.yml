services:

  laravel:
    build:
      context: .
    container_name: kulsah-laravel
    volumes:
      - ./:/var/www
    depends_on:
      - postgres
      - redis
    environment:
      DB_HOST: postgres
      DB_DATABASE: kulsah
      DB_USERNAME: postgres
      DB_PASSWORD: password
      REDIS_HOST: redis
      FASTAPI_URL: http://fastapi:8000

  nginx:
    image: nginx:alpine
    container_name: kulsah-nginx
    ports:
      - "8000:80"
    volumes:
      - ./kulsah_backend:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel

  fastapi:
    build:
      context: ./ai-service-fastapi
    container_name: kulsah-fastapi
    ports:
      - "8001:8000"
    volumes:
      - ./ai-service-fastapi:/app
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/kulsah
      REDIS_URL: redis://redis:6379

  postgres:
    image: postgres:15
    container_name: kulsah-postgres
    restart: always
    environment:
      POSTGRES_DB: kulsah
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: kulsah-redis
    ports:
      - "6379:6379"

volumes:
  pgdata: