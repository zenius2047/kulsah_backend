services:

  laravel:
    build:
      context: .
    container_name: kulsah-laravel
    volumes:
      - ./:/var/www
      - /var/www/vendor
      - ./storage/firebase:/var/www/storage/firebase:ro
    depends_on:
      - postgres
      - redis
    environment:
      DB_HOST: postgres
      DB_DATABASE: kulsah
      DB_USERNAME: postgres
      DB_PASSWORD: password
      REDIS_HOST: redis
      FASTAPI_URL: http://fastapi:8000
      FASTAPI_SHARED_SECRET: ${FASTAPI_SHARED_SECRET}
      FASTAPI_SIGNATURE_TTL_SECONDS: ${FASTAPI_SIGNATURE_TTL_SECONDS:-300}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-local}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-local}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-local}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      GOOGLE_APPLICATION_CREDENTIALS: /var/www/storage/firebase/service-account.json

  queue:
    build:
      context: .
    container_name: kulsah-queue
    volumes:
      - ./:/var/www
      - /var/www/vendor
      - ./storage/firebase:/var/www/storage/firebase:ro
    command: php artisan horizon
    depends_on:
      - postgres
      - redis
      - laravel
    restart: always
    environment:
      DB_HOST: postgres
      DB_DATABASE: kulsah
      DB_USERNAME: postgres
      DB_PASSWORD: password
      REDIS_HOST: redis
      FASTAPI_URL: http://fastapi:8000
      FASTAPI_SHARED_SECRET: ${FASTAPI_SHARED_SECRET}
      FASTAPI_SIGNATURE_TTL_SECONDS: ${FASTAPI_SIGNATURE_TTL_SECONDS:-300}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-local}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-local}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-local}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      GOOGLE_APPLICATION_CREDENTIALS: /var/www/storage/firebase/service-account.json

  media:
    build:
      context: .
    container_name: kulsah-media
    volumes:
      - ./:/var/www
      - /var/www/vendor
      - ./storage/firebase:/var/www/storage/firebase:ro
    command: php artisan queue:work redis --queue=videos --tries=3 --timeout=1200 --memory=512 --sleep=1
    depends_on:
      - postgres
      - redis
      - laravel
    restart: always
    environment:
      DB_HOST: postgres
      DB_DATABASE: kulsah
      DB_USERNAME: postgres
      DB_PASSWORD: password
      REDIS_HOST: redis
      REDIS_QUEUE_RETRY_AFTER: 1260
      FASTAPI_URL: http://fastapi:8000
      FASTAPI_SHARED_SECRET: ${FASTAPI_SHARED_SECRET}
      FASTAPI_SIGNATURE_TTL_SECONDS: ${FASTAPI_SIGNATURE_TTL_SECONDS:-300}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-local}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-local}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-local}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      GOOGLE_APPLICATION_CREDENTIALS: /var/www/storage/firebase/service-account.json
  scheduler:
    build:
      context: .
    container_name: kulsah-scheduler
    volumes:
      - ./:/var/www
      - /var/www/vendor
      - ./storage/firebase:/var/www/storage/firebase:ro
    command: php artisan schedule:work
    depends_on:
      - postgres
      - redis
      - laravel
    restart: always
    environment:
      DB_HOST: postgres
      DB_DATABASE: kulsah
      DB_USERNAME: postgres
      DB_PASSWORD: password
      REDIS_HOST: redis
      FASTAPI_URL: http://fastapi:8000
      FASTAPI_SHARED_SECRET: ${FASTAPI_SHARED_SECRET}
      FASTAPI_SIGNATURE_TTL_SECONDS: ${FASTAPI_SIGNATURE_TTL_SECONDS:-300}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-local}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-local}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-local}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      GOOGLE_APPLICATION_CREDENTIALS: /var/www/storage/firebase/service-account.json
  reverb:
    build:
      context: .
    container_name: kulsah-reverb
    volumes:
      - ./:/var/www
      - /var/www/vendor
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      - postgres
      - redis
      - laravel
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_HOST: postgres
      DB_DATABASE: kulsah
      DB_USERNAME: postgres
      DB_PASSWORD: password
      REDIS_HOST: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-local}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-local}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-local}
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    ports:
      - "8080:8080"

  nginx:
    image: nginx:alpine
    container_name: kulsah-nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel

  ngrok:
    image: ngrok/ngrok:alpine
    container_name: kulsah-ngrok
    depends_on:
      - nginx
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: ["http", "nginx:80"]
    ports:
      - "4040:4040"

  fastapi:
    build:
      context: ./ai-service-fastapi
    container_name: kulsah-fastapi
    ports:
      - "8001:8000"
    volumes:
      - ./ai-service-fastapi:/app
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/kulsah
      REDIS_URL: redis://redis:6379
      FASTAPI_SHARED_SECRET: ${FASTAPI_SHARED_SECRET}
      FASTAPI_SIGNATURE_TTL_SECONDS: ${FASTAPI_SIGNATURE_TTL_SECONDS:-300}

  postgres:
    image: postgres:15
    container_name: kulsah-postgres
    restart: always
    environment:
      POSTGRES_DB: kulsah
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: kulsah-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
